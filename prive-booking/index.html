    <!-- Fonts: General Sans (Fontshare, headings) + Inter (Google, body) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured data: local mobile hair salon -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HairSalon",
      "name": "Privé by Luchi",
      "description": "Luxury mobile braiding studio in Lagos, Nigeria. Knotless braids, box braids, faux locs, butterfly locs, cornrows and frontal installs, booked to your door.",
      "url": "https://privebyluchi.com/",
      "image": "https://privebyluchi.com/og-image.jpg",
      "logo": "https://privebyluchi.com/logo.svg",
      "telephone": "+2348156973807",
      "email": "luxuriousluchihairs@gmail.com",
      "priceRange": "₦₦",
      "currenciesAccepted": "NGN",
      "founder": { "@type": "Person", "name": "Chioma Christine Cletus" },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lagos",
        "addressRegion": "Lagos",
        "addressCountry": "NG"
      },
      "areaServed": [
        { "@type": "City", "name": "Lagos" },
        { "@type": "Country", "name": "Nigeria" }
      ],
      "sameAs": [
        "https://www.instagram.com/priveby_luchi",
        "https://www.tiktok.com/@priveby_luchi"
      ],
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        "opens": "09:00",
        "closes": "16:00"
      }],
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Knotless / Box Braids" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Fulani / Cornrows" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Stitch Braids" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Faux Locs" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Butterfly Locs" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Frontal Install" } }
      ]
    }
    </script>

    <!-- Loading screen (shows instantly, before the app boots) -->
    <style>
      #loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #FFFBF9;
        transition: opacity .55s ease, visibility .55s ease;
      }
      #loader.loaded { opacity: 0; visibility: hidden; }
      #loader .loader__badge {
        width: 78px; height: 78px; border-radius: 22px; background: #1E4D3E;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 18px 44px rgba(30, 77, 62, .28);
        animation: loaderPulse 1.6s ease-in-out infinite;
      }
      #loader .loader__bloom {
        width: 42px; height: 42px; color: #E85A8A;
        transform-origin: 50% 50%;
        animation: loaderSpin 1.5s linear infinite;
      }
      #loader .loader__word {
        font-family: Georgia, 'Times New Roman', serif; letter-spacing: .32em; text-transform: uppercase;
        font-size: 12px; color: #1E4D3E; opacity: .75; padding-left: .32em;
      }
      @keyframes loaderSpin { to { transform: rotate(360deg); } }
      @keyframes loaderPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) {
        #loader .loader__bloom, #loader .loader__badge { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading Privé by Luchi">
      <div class="loader__badge">
        <svg class="loader__bloom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 12c0-3 2-5 2-7a2 2 0 0 0-4 0c0 2 2 4 2 7Z" />
          <path d="M12 12c3 0 5-2 7-2a2 2 0 0 1 0 4c-2 0-4-2-7-2Z" />
          <path d="M12 12c0 3 2 5 2 7a2 2 0 0 1-4 0c0-2 2-4 2-7Z" />
          <path d="M12 12c-3 0-5-2-7-2a2 2 0 0 0 0 4c2 0 4-2 7-2Z" />
          <circle cx="12" cy="12" r="1.6" />
        </svg>
      </div>
      <div class="loader__word">Privé by Luchi</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
